name: Blazor Deploy a GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. Configurar .NET 8.0 (Versión moderna, cámbiala si usas 7.0)
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    # 2. Restaurar, Publicar y Corregir Base Path
    - name: Restore and Publish Project
      # Este comando compila y corrige la ruta base en el index.html
      run: |
        dotnet restore
        dotnet publish "DisenioNewApp.csproj" -c Release -o output/wwwroot --nologo -p:GitHubPagesId=/DisenioNewApp/
      
    # 3. Desplegar SOLAMENTE la carpeta compilada (output/wwwroot) a la rama gh-pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: output/wwwroot # <--- ESTO ES CRÍTICO: SOLO LA SALIDA
        # forzar la subida aunque no haya cambios detectados:
        force_orphan: true 
