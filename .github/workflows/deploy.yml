name: Blazor Deploy a GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 1. Configurar .NET 8.0 (Usando 8.0.x por ser la versión moderna)
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' 

    # 2. Restaurar, Publicar y Corregir Base Path
    - name: Restore and Publish Project
      # Este comando compila, genera la salida en output/wwwroot y corrige la ruta base.
      run: |
        dotnet restore
        dotnet publish "DisenioNewApp.csproj" -c Release -o output/wwwroot --nologo -p:GitHubPagesId=/DisenioNewApp/
      
    # 3. Desplegar SOLAMENTE la carpeta compilada (output/wwwroot) a la rama gh-pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: output/wwwroot 
        # ESTA LÍNEA ES CLAVE: Fuerza a la rama gh-pages a ser huérfana, 
        # eliminando todo el historial y contenido previo antes de subir los archivos.
        force_orphan: true 
