name: Blazor Deploy a GitHub Pages

on:
  push:
    branches: [ master ] # Asegúrate de que esta sea tu rama principal (master o main)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    
    # 1. Checkout: Baja el código de la rama master
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    # 2. Setup .NET Core SDK: Instala .NET 8
    - name: Setup .NET Core SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 3. Restore and Publish Project: Compila y crea la salida estática
    # La salida final estará en: /home/runner/work/DisenioNewApp/DisenioNewApp/bin/Release/net8.0/publish/wwwroot/
    - name: Restore and Publish Project
      run: |
        dotnet restore DisenioNewApp.csproj
        dotnet publish DisenioNewApp.csproj -c Release --nologo

    # 4. Ajuste de Base Path: Reemplaza la base href en el index.html de salida
    # CRÍTICO: Necesita saber el nombre de tu repositorio ('/DisenioNewApp/')
    - name: Rewrite base tag
      if: success()
      uses: SteveSandersonMS/ghpages-spa@v1.1.9
      with:
          repo: ${{ github.repository }} # Esto automáticamente detecta iramirez22-cloud/DisenioNewApp
          
    # 5. Deploy to GitHub Pages: Sube el contenido de la carpeta 'publish/wwwroot' a gh-pages
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        # La carpeta donde se publica Blazor es dentro de la carpeta 'publish'
        publish_dir: bin/Release/net8.0/publish/wwwroot # <--- RUTA CORRECTA DE BLZOR
        
        # Estas opciones aseguran que la rama gh-pages solo tenga los archivos de la app:
        force_orphan: true
        keep_files: false
